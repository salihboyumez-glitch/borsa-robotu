name: Borsa Robotu 7/24

on:
  # Tekrarlı ve gereksiz haber akışını önlemek için otomatik zamanlama
  # market-scanner.yml altında tek merkezden yönetilir.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: borsa-robotu-scanner
  cancel-in-progress: false

jobs:
  tara-ve-bildir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Gereksinimleri yükle
        run: python -m pip install -r requirements.txt

      - name: Haber ve piyasa taramasını çalıştır
        run: python background_scanner.py

      - name: Mesaj durumunu ortak geçmişe kaydet
        if: always()
        run: |
          git config user.name "borsa-robotu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f .news_telegram_state.json .stocktwits_state.json .opportunity_telegram_state.json .unusual_telegram_state.json .price_movement_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update scanner state [skip ci]"
            git pull --rebase
            git push
          fi
