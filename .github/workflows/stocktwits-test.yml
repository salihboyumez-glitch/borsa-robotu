name: Stocktwits Telegram Testi

on:
  workflow_dispatch:

jobs:
  test-message:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Stocktwits verisini dene ve Telegram'a gönder
        run: |
          python - <<'PY'
          import os
          import requests
          from stocktwits_social import sosyal_satirlar

          satirlar = sosyal_satirlar("NTSK")
          mesaj = [
              "🧪 STOCKTWITS TEST BİLDİRİMİ — NTSK",
              "Robot bağlantısı ve sosyal veri entegrasyonu deneniyor.",
          ]
          mesaj += satirlar or ["", "ℹ️ Stocktwits şu anda veri vermedi; robot çalışmaya devam ediyor."]
          mesaj += ["", "⚠️ Bu bir testtir, yatırım tavsiyesi değildir."]
          cevap = requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data={"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": "\n".join(mesaj), "parse_mode": "HTML"},
              timeout=20,
          )
          cevap.raise_for_status()
          PY
