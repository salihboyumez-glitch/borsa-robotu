name: ABD Piyasa Firsat Taramasi

on:
  schedule:
    # Türkiye 15:30 haber özeti, ABD açılış öncesi/seans/kapanış taramaları.
    # New York yaz/kış saati kod içinde otomatik hesaplanır.
    - cron: "*/15 12-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Piyasayi tara ve uyari gonder
        run: python background_scanner.py

      - name: Fiyat hareketi esiklerini tara
        run: python background_scanner.py hareket

      - name: Tekrar bildirim durumunu kaydet
        if: always()
        run: |
          git config user.name "borsa-robotu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f .news_telegram_state.json .opportunity_telegram_state.json .unusual_telegram_state.json .price_movement_state.json tradingview_watchlist_cache.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update scanner state [skip ci]"
            git pull --rebase
            git push
          fi
