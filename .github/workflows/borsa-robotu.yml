name: Borsa Robotu 7/24

on:
  schedule:
    - cron: "19,49 * * * *"
  workflow_dispatch:

concurrency:
  group: borsa-robotu-scanner
  cancel-in-progress: false

jobs:
  tara-ve-bildir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Mesaj durumunu geri yükle
        uses: actions/cache/restore@v4
        with:
          path: |
            .news_telegram_state.json
            .opportunity_telegram_state.json
            .unusual_telegram_state.json
          key: telegram-state-${{ github.run_id }}
          restore-keys: telegram-state-

      - name: Gereksinimleri yükle
        run: python -m pip install -r requirements.txt

      - name: Haber ve piyasa taramasını çalıştır
        run: python background_scanner.py

      - name: Mesaj durumunu sakla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .news_telegram_state.json
            .opportunity_telegram_state.json
            .unusual_telegram_state.json
          key: telegram-state-${{ github.run_id }}
